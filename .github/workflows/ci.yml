name: CI

# Once per PR (and each push to it). Pushes to main deploy (deploy.yml).
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests, including every cartoon's lines and ids (tests/unit/cartoon-lint.test.ts).
      - run: npm test
      # Every cartoon against the house rules (scripts/check-cartoon.ts).
      - run: npm run check
      - run: npm run build

  # The screens at both iPad sizes, and every cartoon played through at 1180 × 820.
  # Too slow to run on every PR: they're run locally before a PR (npm run
  # test:e2e), and here only when started by hand (Actions → CI → Run workflow).
  # When they do run, they're shared out over a few machines at once (each
  # runs its share on every core: playwright.config.ts).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The check job typechecks; here the site only needs building.
      - run: npx vite build
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
        env:
          PW_PREBUILT: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
